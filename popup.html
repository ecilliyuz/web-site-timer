<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 16px;
            font-family: Arial, sans-serif;
        }

        .site-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .site-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .site-domain {
            font-weight: bold;
        }

        .site-time {
            color: #666;
        }

        .site-info {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            margin-right: 10px;
        }

        .delete-btn {
            color: #f44336;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        .delete-btn:hover {
            color: #d32f2f;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Site Süre Takibi</h2>
        <button id="clearData">Verileri Temizle</button>
    </div>
    <div class="site-list" id="siteList">
        <!-- Site listesi buraya dinamik olarak eklenecek -->
    </div>
    <script src="popup.js"></script>
</body>

</html>
